name: A replay gives a different result
description: You ran scripts/prove.py and a line says DIFFERENCE or UNREAD.
title: "Replay: "
body:
  - type: input
    id: command
    attributes:
      label: The command you ran
      description: The exact command, from the repository root.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: The lines concerned and the date you ran it. A DIFFERENCE can mean the Safe changed after the named block.
    validations:
      required: true
