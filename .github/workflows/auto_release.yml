name: Auto Release

# One dated release per day on which README.md changes on main.
# Release notes are a fixed neutral line; commit messages are not copied.

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Create dated release (at most one per day)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TARGET: ${{ github.sha }}
        run: |
          DATE_UTC="$(date -u +%Y-%m-%d)"
          TAG="update-${DATE_UTC}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Research update ${DATE_UTC}" \
            --notes "Research update of ${DATE_UTC}. Current figures and findings are in the README." \
            --target "$REL_TARGET"
